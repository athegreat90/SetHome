plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
    // Pinned to match the Kotlin version bundled by kotlinlangforge_version in gradle.properties
    // (KotlinLangForge 2.14.1-k2.4.20-3.1+neoforge bundles Kotlin 2.4.20) - the plugins {} block only accepts
    // literal version strings, so this can't reference that property directly; keep the two in sync by hand.
    id 'org.jetbrains.kotlin.jvm' version '2.4.20'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    // KotlinLangForge is not published to Maven Central.
    maven {
        name = 'nyon'
        url = 'https://repo.nyon.dev/releases'
    }
}

def mongoDriverVersion = '5.8.0'
def sqliteDriverVersion = '3.49.1.0'

dependencies {
    jarJar(implementation("org.mongodb:mongodb-driver-sync:${mongoDriverVersion}")) {
        version {
            strictly '[5.8,5.9)'
            prefer mongoDriverVersion
        }
    }
    // mongodb-driver-sync depends on these transitively, but jarJar does not embed transitive
    // dependencies automatically, so each jarred artifact must be declared explicitly.
    jarJar(implementation("org.mongodb:mongodb-driver-core:${mongoDriverVersion}")) {
        version {
            strictly '[5.8,5.9)'
            prefer mongoDriverVersion
        }
    }
    jarJar(implementation("org.mongodb:bson:${mongoDriverVersion}")) {
        version {
            strictly '[5.8,5.9)'
            prefer mongoDriverVersion
        }
    }
    jarJar(implementation("org.xerial:sqlite-jdbc:${sqliteDriverVersion}")) {
        version {
            strictly "[${sqliteDriverVersion},3.50)"
            prefer sqliteDriverVersion
        }
    }

    // KotlinLangForge provides the Kotlin runtime (stdlib/reflect/coroutines/serialization, shaded into its
    // own jar) that this mod's Kotlin-compiled classes need at runtime, so it's required on the server - see
    // the "klf" entry in neoforge.mods.toml. Declared as a plain (not jarJar) dependency: it stays off the
    // packaged mod jar (only jarJar-wrapped dependencies get embedded), while ModDevGradle still picks it up
    // as an installed mod for runClient/runServer/runGameTestServer dev runs.
    implementation("dev.nyon:KotlinLangForge:${kotlinlangforge_version}")
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

kotlin {
    jvmToolchain(25)
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id,
                    '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
