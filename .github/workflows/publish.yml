name: Publish to Modrinth

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      commit:
        type: string
        required: true
      artifact:
        type: string
        required: true
    secrets:
      MODRINTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    concurrency:
      group: sethome-modrinth-${{ inputs.version || github.event.release.tag_name }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Checkout executing workflow tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: tools

      - name: Checkout exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit || format('refs/tags/{0}', github.event.release.tag_name) }}
          path: source
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        if: ${{ !inputs.artifact }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        if: ${{ !inputs.artifact }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Build with Gradle
        if: ${{ !inputs.artifact }}
        run: ./gradlew build

      - name: Reuse the exact GitHub release candidate
        if: ${{ inputs.artifact }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: source/candidate

      - name: Verify release identity and check for an existing Modrinth version
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.event.release.tag_name }}
          COMMIT: ${{ inputs.commit }}
          JAR_DIRECTORY: ${{ inputs.artifact && 'candidate' || 'build/libs' }}
        run: python3 ../tools/.github/scripts/release.py check

      - name: Publish to Modrinth
        if: steps.publication.outputs.already_published != 'true'
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075 # v3.3.1
        with:
          modrinth-id: HhUmEUqn
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: source/${{ steps.publication.outputs.jar }}
          name: ${{ steps.publication.outputs.name }}
          version: ${{ steps.publication.outputs.version }}
          version-type: ${{ steps.publication.outputs.version_type }}
          changelog: ${{ steps.publication.outputs.changelog }}
          loaders: neoforge
          environment: dedicated-server
          game-versions: |
            26.1.2
            26.2
            26.3
          game-version-filter: none
          java: 25
