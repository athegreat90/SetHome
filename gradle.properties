# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.3
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
# Accepts 26.1.2 and every patch of 26.1/26.2/26.3, excludes the already-in-development 26.4 line.
minecraft_version_range=[26.1.2,26.4)
# The Neo version must agree with the Minecraft version to get a valid artifact.
# This is the exact artifact used to compile/run against - pinned to the latest 26.3 beta since
# NeoForge has not shipped a stable build for Minecraft 26.3 yet. Re-pin to a stable 26.3.0.x build
# once NeoForge releases one.
neo_version=26.3.0.37-beta
# Floor for the "neoforge" mod dependency in neoforge.mods.toml. Deliberately decoupled from neo_version
# above (which is the compile-time target) so widening neo_version to a newer/beta build doesn't also
# raise the minimum NeoForge loader version required to run the mod. The minecraft_version_range above is
# the authoritative upper bound; this just keeps the previously-verified 26.1.2 build as the floor.
neo_version_range=[26.1.2.109,)

# The mod's source is Kotlin. The Kotlin Gradle plugin version is pinned directly in build.gradle (it must
# be a literal there, not a property) to 2.4.20, matching the Kotlin release bundled by kotlinlangforge_version
# below - the compile-time Kotlin runtime and the one provided at runtime by the installed KotlinLangForge mod
# must be binary-compatible; keep both pins in sync by hand.
# KotlinLangForge (https://github.com/btwonion/KotlinLangForge, modId "klf") NeoForge artifact version, used
# for the Gradle dependency coordinate only (see build.gradle). Its version string encodes
# <modVersion>-k<kotlinVersion>-<languageProviderVersion>+<loader>, so 2.14.1-k2.4.20-3.1+neoforge means mod
# version 2.14.1, bundled Kotlin 2.4.20, language-provider version 3.1, built for NeoForge.
#
# This replaced an earlier dependency on "Kotlin for Forge" (KFF, thedarkcolour): KFF 6.3.0 declared Minecraft
# support only up to 26.2 and hard-failed to load on this project's minecraft_version=26.3 pin. KotlinLangForge
# 2.14.1-k2.4.20-3.1+neoforge's release notes explicitly say "add support for 26.3", confirmed by testing (see
# MEMORY.md for the full investigation of both).
#
# There is deliberately no "kotlinlangforge_version_range"/[[dependencies.sethome]] entry for "klf": a normal
# FML mod-dependency version check against KLF's full version string above does not work - confirmed by testing,
# FML reports the installed version as "[MISSING]" (unparseable as a plain Maven version) even when the
# versionRange matches exactly, or is loosened to something trivial like "[1,)". KotlinLangForge must instead
# be required via its own "klf" language-loader mechanism (see neoforge.mods.toml's top-level
# modLoader/loaderVersion, and KotlinLangForge's own integration docs) - that path uses a different, small
# "language provider version" ("3.1" here) for compatibility checks, not this full artifact version string.
# Re-verify this pin (and the Kotlin Gradle plugin version above) whenever bumping kotlinlangforge_version -
# check its GitHub release notes for both the bundled Kotlin version and Minecraft/NeoForge support range.
kotlinlangforge_version=2.14.1-k2.4.20-3.1+neoforge

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=sethome
# The human-readable display name for the mod.
mod_name=Set Home Mod
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=All Rights Reserved
# The mod version. See https://semver.org/
mod_version=2.1.0-RC4
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=de.alexandermora.sethome
