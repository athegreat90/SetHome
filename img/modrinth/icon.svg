  <rect x="128" y="208" width="256" height="144" fill="#0b1422"/>
  <rect x="144" y="224" width="224" height="120" fill="#efe6cb"/>
  <rect x="144" y="224" width="224" height="16" fill="#bba98d"/>
  <rect x="144" y="320" width="224" height="24" fill="#d3c2a1"/>
  <rect x="144" y="240" width="16" height="104" fill="#ddccaa"/>
  <rect x="352" y="240" width="16" height="104" fill="#ddccaa"/>

  <!-- A stair-stepped roof, readable even at small icon sizes. -->
  <polygon fill="#e5a04b" stroke="#0b1422" stroke-width="16" stroke-linejoin="miter" points="104,216 128,216 128,192 152,192 152,168 176,168 176,144 200,144 200,120 224,120 224,96 288,96 288,120 312,120 312,144 336,144 336,168 360,168 360,192 384,192 384,216 408,216 408,232 104,232"/>
  <rect x="224" y="104" width="56" height="16" fill="#ffdb83"/>
  <rect x="200" y="128" width="32" height="16" fill="#ffdb83"/>
  <rect x="176" y="152" width="32" height="16" fill="#ffdb83"/>
  <rect x="152" y="176" width="32" height="16" fill="#ffdb83"/>
  <rect x="128" y="200" width="32" height="16" fill="#ffdb83"/>
  <rect x="160" y="216" width="240" height="8" fill="#bd743c"/>

  <!-- Two simple windows. -->
  <rect x="160" y="256" width="40" height="48" fill="#77543c"/>
  <rect x="168" y="264" width="24" height="24" fill="#66ced3"/>
  <rect x="168" y="264" width="16" height="8" fill="#c1fff2"/>
  <rect x="312" y="256" width="40" height="48" fill="#77543c"/>
  <rect x="320" y="264" width="24" height="24" fill="#66ced3"/>
  <rect x="320" y="264" width="16" height="8" fill="#c1fff2"/>

  <!-- The home is also a teleport destination: a luminous portal doorway. -->
  <rect x="208" y="240" width="96" height="112" fill="#163b49"/>
  <rect x="216" y="248" width="80" height="104" fill="#48dccc"/>
