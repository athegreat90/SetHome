<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" shape-rendering="crispEdges" role="img" aria-labelledby="title desc">
  <title id="title">SetHome</title>
  <desc id="desc">An original pixel-art house with a glowing cyan teleport doorway on a floating grass block, framed by a dark stepped badge.</desc>

  <!-- Stepped badge; the corner pixels remain transparent. -->
  <polygon fill="#0b1422" points="48,16 464,16 464,32 480,32 480,48 496,48 496,464 480,464 480,480 464,480 464,496 48,496 48,480 32,480 32,464 16,464 16,48 32,48 32,32 48,32"/>
  <polygon fill="#21364b" points="56,32 456,32 456,48 472,48 472,456 456,456 456,472 56,472 56,456 40,456 40,56 56,56"/>
  <polygon fill="#182b3e" points="56,48 456,48 456,64 464,64 464,448 448,448 448,464 64,464 64,448 48,448 48,64 56,64"/>

  <!-- Teleport sparks and a quiet pixel shadow. -->
  <rect x="72" y="136" width="16" height="16" fill="#477089"/>
  <rect x="96" y="272" width="8" height="8" fill="#50dfdc"/>
  <rect x="416" y="264" width="16" height="16" fill="#50dfdc"/>
  <polygon fill="#8bfff0" points="400,88 416,88 416,104 432,104 432,120 416,120 416,136 400,136 400,120 384,120 384,104 400,104"/>
  <rect x="120" y="432" width="272" height="16" fill="#101e30"/>

  <!-- Floating grass block. -->
  <polygon fill="#0b1422" points="88,336 424,336 424,384 408,384 408,416 392,416 392,432 120,432 120,416 104,416 104,384 88,384"/>
  <rect x="112" y="368" width="288" height="40" fill="#926044"/>
  <rect x="128" y="408" width="256" height="8" fill="#694635"/>
  <rect x="112" y="392" width="288" height="16" fill="#784e39"/>
  <rect x="144" y="384" width="24" height="16" fill="#b07b52"/>
  <rect x="184" y="400" width="16" height="8" fill="#b07b52"/>
  <rect x="344" y="380" width="24" height="12" fill="#b07b52"/>
  <rect x="96" y="344" width="320" height="24" fill="#76cc62"/>
  <rect x="96" y="344" width="320" height="8" fill="#b4ed83"/>
  <rect x="112" y="368" width="32" height="8" fill="#4b984f"/>
  <rect x="176" y="368" width="32" height="8" fill="#4b984f"/>
  <rect x="320" y="368" width="32" height="8" fill="#4b984f"/>
  <rect x="384" y="368" width="16" height="8" fill="#4b984f"/>

